# Cloudflare Pages の設定（デモ用）。
name = "browser-handoff-demo"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# 引換券の保存先（`npx wrangler kv namespace create HANDOFF_KV` で作ったもの）。
# ローカルの `npm run dev` は --kv HANDOFF_KV でローカルのものを使う。
[[kv_namespaces]]
binding = "HANDOFF_KV"
id = "3d096a25c713446295104e5cc2056690"
