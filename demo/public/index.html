<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>browser-handoff デモ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Handoff">
  <meta name="theme-color" content="#2f6fde">
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1b1d21;
      --muted: #5f6672;
      --line: #dfe2e7;
      --accent: #2f6fde;
      --accent-text: #ffffff;
      --ok: #18794e;
      --ok-bg: #e6f4ec;
      --warn: #a3520b;
      --warn-bg: #fdf0e1;
      --code-bg: #f0f2f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111316;
        --card: #1b1e23;
        --text: #e8eaed;
        --muted: #9aa1ac;
        --line: #2e333a;
        --accent: #5b8ff0;
        --accent-text: #0b0d10;
        --ok: #6fd3a0;
        --ok-bg: #16301f;
        --warn: #f0b070;
        --warn-bg: #352512;
        --code-bg: #24282e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }
    main { max-width: 640px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 8px 0 4px; }
    h2 { font-size: 17px; margin: 0 0 8px; }
    p { margin: 0 0 8px; }
    .lead { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
    section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; margin-left: 6px; vertical-align: 2px; }
    .summary { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .note { color: var(--muted); font-size: 14px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 8px 0; font-size: 14px; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .mono { background: var(--code-bg); border-radius: 6px; padding: 6px 8px; overflow-wrap: anywhere; white-space: pre-wrap; }
    button, select, input[type="text"], input[type="number"] {
      font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); padding: 8px 12px;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; width: 100%; padding: 12px; font-size: 17px; }
    button:disabled { opacity: .5; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
    .row > input[type="text"] { flex: 1 1 180px; min-width: 0; }
    select { max-width: 100%; }
    label.field { display: block; font-size: 14px; color: var(--muted); margin-top: 8px; }
    .big-id { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 28px; font-weight: 700; letter-spacing: .05em; }
    .result { border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
    .result.ok { background: var(--ok-bg); color: var(--ok); }
    .result.warn { background: var(--warn-bg); color: var(--warn); }
    .result.plain { background: var(--code-bg); }
    .result:empty { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button { font-size: 14px; padding: 6px 10px; border-radius: 999px; }
    ol.signals { margin: 6px 0 0; padding-left: 20px; font-size: 14px; }
    textarea { width: 100%; min-height: 160px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    .log { max-height: 320px; overflow: auto; font-size: 12px; }
    .log div { padding: 3px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>browser-handoff デモ</h1>
    <p class="lead">キットを実機で確かめるためのページです。押したことと結果は下の「記録」に残るので、最後にコピーして送ってください。</p>
    <div id="app"><p>読み込み中…</p></div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
